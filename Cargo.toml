[package]
name = "dali_tools"
version = "0.1.0"
authors = ["ksb <ksb@fluffware.se>"]
edition = "2024"

[features]
helvar510_driver= ["libusb-async"]
dgw521_driver = ["tokio-serial", "tokio-modbus"]
simulator=[]
pru_driver= []
dali_rpi_driver= ["tokio-serial"]
dummy_driver=[]
httpd=["hyper","bytes", "rust-embed"]
sim_serial=["tokio-serial", "simulator"]

[dependencies]
futures	= "0.3.*"
futures-util = "*"
tokio= {version = "1.32", features = ["macros", "rt-multi-thread", "time", "io-util", "sync", "fs", "signal"]}
tokio-stream = "0.1"
clap = {version="4.4", features = ["derive","env"]}
libusb-async = { git = "https://github.com/fluffware/libusb-rs-async.git", optional = true}
tokio-modbus = {version="0.17.0", default-features = false, features=["rtu"], optional = true}
tokio-serial = {version = "5.5", optional = true}
lazy_static = "1"
nix = "0.22"
log="*"
tracing-subscriber = "0.3"
serde_json = "1.0.91"
serde = "*"
serde_derive = "*"


hyper = {version="1.11.0", features = ["server", "http1", "http2"], optional=true}
hyper-staticfile = {version = "*", optional=true}
form_urlencoded = {version = "1.0", optional=true}
bytes={version="*", optional=true}
rust-embed={version="6.7.0", features=["include-exclude"], optional=true}
yaml_serde = "0.10.4"
rand = { version = "0.10.1", features = ["thread_rng"] }
paste = "1.0.15"
linkme = "0.3.36"
tokio-util = "0.7.18"
field_access_json_derive="*"
field_access_json="*"
http-body-util = "0.1.4"
hyper-util = { version = "0.1.20", features = ["tokio","server", "server-graceful", "http1"] }

[[bin]]
name = "helvar_dump"
path = "src/bin/helvar_dump.rs"
required-features = ["helvar510_driver"]

[[bin]]
name = "manual_identify"
path = "src/bin/manual_identify/main.rs"
required-features = ["httpd"]


